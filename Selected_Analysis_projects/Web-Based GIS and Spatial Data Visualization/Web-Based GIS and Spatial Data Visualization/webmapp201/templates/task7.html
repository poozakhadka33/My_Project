<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Task 7</title>

  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css">

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="{{ url_for('static', filename='school_clusters.js') }}"></script>

  <style>
    body, html {
      height: 100%;
      margin: 0;
    }

    #map {
      height: 100%;
      width: 100%;
    }

    #sidebar {
      position: absolute;
      top: 50%;
      z-index: 1000;
      background: rgba(255, 255, 255, 0.95);
      padding: 15px;
      border-radius: 20px;
      box-shadow: 0 0 10px rgba(0, 0, 0, 0.3);
      width: 200px;
    }

    #infoPanel {
      position: absolute;
      top: 10px;
      right: 10px;
      z-index: 1000;
      background: rgba(255, 255, 255, 0.95);
      padding: 15px;
      border-radius: 20px;
      box-shadow: 0 0 10px rgba(0, 0, 0, 0.3);
      width: 400px;
    }

    img.feature-img {
      width: 100%;
      border-radius: 5px;
      margin-top: 5px;
    }

    .btn-block {
      margin-bottom: 10px;
    }
  </style>
</head>
<body>

  <div id="map"></div>

  <div id="sidebar">
    <h5>Tasks</h5>
    <button class="btn btn-success btn-block" onclick="location.href='{{ url_for('task1') }}'">Task 1</button>
    <button class="btn btn-success btn-block" onclick="location.href='{{ url_for('task2') }}'">Task 2</button>
    <button class="btn btn-success btn-block" onclick="location.href='{{ url_for('task3') }}'">Task 3</button>
    <button class="btn btn-success btn-block" onclick="location.href='{{ url_for('task4') }}'">Task 4</button>
    <button class="btn btn-success btn-block" onclick="location.href='{{ url_for('task5') }}'">Task 5</button>
    <button class="btn btn-success btn-block" onclick="location.href='{{ url_for('task6') }}'">Task 6</button>
    <button class="btn btn-success btn-block" onclick="location.href='{{ url_for('task7') }}'">Task 7</button>
  </div>

  <script>
    const map = L.map('map').setView([59.33, 18.06], 11);

    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
      attribution: '© OpenStreetMap contributors'
    }).addTo(map);

    const task7clusters = ['purple', 'orange', 'blue'];

    const task7cluster = L.geoJSON(schoolClusters, {
      pointToLayer: function (feature, latlng) {
        const task7clusterId = feature.properties.cluster;
        return L.circleMarker(latlng, {
          radius: 10,
          color: task7clusters[task7clusterId] || 'magenta',
          fillColor: task7clusters[task7clusterId] || 'magenta',
          fillOpacity: 0.5,
          weight: 1
        });
      },
      onEachFeature: function (feature, layer) {
        const task7props = feature.properties;
        layer.bindPopup(`<strong>${task7props.Name}</strong><br>${task7props.descriptio}`);
      }
    }).addTo(map);

    map.fitBounds(task7cluster.getBounds());

    
  </script>

</body>
</html>
